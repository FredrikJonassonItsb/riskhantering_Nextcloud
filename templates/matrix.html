<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Riskmatris - Nextcloud/Hubs</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/matrix.css') }}">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <div class="header-content">
                <h1>🛡️ Riskmatris</h1>
                <p class="subtitle">Visualisering av risker enligt sannolikhet och konsekvens</p>
            </div>
            <div class="header-actions">
                <button class="btn btn-secondary" onclick="location.href='/'">← Tillbaka till lista</button>
                <button class="btn btn-secondary" id="refreshBtn">🔄 Uppdatera</button>
            </div>
        </header>

        <!-- Riskmatris -->
        <section class="matrix-section">
            <div class="matrix-container">
                <div class="matrix-wrapper">
                    <!-- Y-axel etikett -->
                    <div class="axis-label-y">Sannolikhet</div>
                    
                    <!-- Matris -->
                    <div class="matrix-grid">
                        <!-- Rad 5 (Mycket hög sannolikhet) -->
                        <div class="matrix-row">
                            <div class="row-label">5</div>
                            <div class="matrix-cell cell-5-1" data-prob="5" data-cons="1" title="Sannolikhet: 5, Konsekvens: 1"></div>
                            <div class="matrix-cell cell-5-2" data-prob="5" data-cons="2" title="Sannolikhet: 5, Konsekvens: 2"></div>
                            <div class="matrix-cell cell-5-3" data-prob="5" data-cons="3" title="Sannolikhet: 5, Konsekvens: 3"></div>
                            <div class="matrix-cell cell-5-4" data-prob="5" data-cons="4" title="Sannolikhet: 5, Konsekvens: 4"></div>
                            <div class="matrix-cell cell-5-5" data-prob="5" data-cons="5" title="Sannolikhet: 5, Konsekvens: 5"></div>
                        </div>

                        <!-- Rad 4 -->
                        <div class="matrix-row">
                            <div class="row-label">4</div>
                            <div class="matrix-cell cell-4-1" data-prob="4" data-cons="1" title="Sannolikhet: 4, Konsekvens: 1"></div>
                            <div class="matrix-cell cell-4-2" data-prob="4" data-cons="2" title="Sannolikhet: 4, Konsekvens: 2"></div>
                            <div class="matrix-cell cell-4-3" data-prob="4" data-cons="3" title="Sannolikhet: 4, Konsekvens: 3"></div>
                            <div class="matrix-cell cell-4-4" data-prob="4" data-cons="4" title="Sannolikhet: 4, Konsekvens: 4"></div>
                            <div class="matrix-cell cell-4-5" data-prob="4" data-cons="5" title="Sannolikhet: 4, Konsekvens: 5"></div>
                        </div>

                        <!-- Rad 3 -->
                        <div class="matrix-row">
                            <div class="row-label">3</div>
                            <div class="matrix-cell cell-3-1" data-prob="3" data-cons="1" title="Sannolikhet: 3, Konsekvens: 1"></div>
                            <div class="matrix-cell cell-3-2" data-prob="3" data-cons="2" title="Sannolikhet: 3, Konsekvens: 2"></div>
                            <div class="matrix-cell cell-3-3" data-prob="3" data-cons="3" title="Sannolikhet: 3, Konsekvens: 3"></div>
                            <div class="matrix-cell cell-3-4" data-prob="3" data-cons="4" title="Sannolikhet: 3, Konsekvens: 4"></div>
                            <div class="matrix-cell cell-3-5" data-prob="3" data-cons="5" title="Sannolikhet: 3, Konsekvens: 5"></div>
                        </div>

                        <!-- Rad 2 -->
                        <div class="matrix-row">
                            <div class="row-label">2</div>
                            <div class="matrix-cell cell-2-1" data-prob="2" data-cons="1" title="Sannolikhet: 2, Konsekvens: 1"></div>
                            <div class="matrix-cell cell-2-2" data-prob="2" data-cons="2" title="Sannolikhet: 2, Konsekvens: 2"></div>
                            <div class="matrix-cell cell-2-3" data-prob="2" data-cons="3" title="Sannolikhet: 2, Konsekvens: 3"></div>
                            <div class="matrix-cell cell-2-4" data-prob="2" data-cons="4" title="Sannolikhet: 2, Konsekvens: 4"></div>
                            <div class="matrix-cell cell-2-5" data-prob="2" data-cons="5" title="Sannolikhet: 2, Konsekvens: 5"></div>
                        </div>

                        <!-- Rad 1 (Låg sannolikhet) -->
                        <div class="matrix-row">
                            <div class="row-label">1</div>
                            <div class="matrix-cell cell-1-1" data-prob="1" data-cons="1" title="Sannolikhet: 1, Konsekvens: 1"></div>
                            <div class="matrix-cell cell-1-2" data-prob="1" data-cons="2" title="Sannolikhet: 1, Konsekvens: 2"></div>
                            <div class="matrix-cell cell-1-3" data-prob="1" data-cons="3" title="Sannolikhet: 1, Konsekvens: 3"></div>
                            <div class="matrix-cell cell-1-4" data-prob="1" data-cons="4" title="Sannolikhet: 1, Konsekvens: 4"></div>
                            <div class="matrix-cell cell-1-5" data-prob="1" data-cons="5" title="Sannolikhet: 1, Konsekvens: 5"></div>
                        </div>
                    </div>

                    <!-- X-axel etikett -->
                    <div class="axis-label-x">Konsekvens →</div>

                    <!-- X-axel siffror -->
                    <div class="matrix-x-labels">
                        <div class="x-label">1</div>
                        <div class="x-label">2</div>
                        <div class="x-label">3</div>
                        <div class="x-label">4</div>
                        <div class="x-label">5</div>
                    </div>
                </div>

                <!-- Legend -->
                <div class="matrix-legend">
                    <div class="legend-item">
                        <div class="legend-color" style="background-color: #4CAF50;"></div>
                        <span>Låg risk (1-5)</span>
                    </div>
                    <div class="legend-item">
                        <div class="legend-color" style="background-color: #FFC107;"></div>
                        <span>Medel risk (6-12)</span>
                    </div>
                    <div class="legend-item">
                        <div class="legend-color" style="background-color: #FF9800;"></div>
                        <span>Höger risk (13-19)</span>
                    </div>
                    <div class="legend-item">
                        <div class="legend-color" style="background-color: #F44336;"></div>
                        <span>Mycket hög risk (20-25)</span>
                    </div>
                </div>
            </div>
        </section>

        <!-- Risktabell -->
        <section class="risks-table-section">
            <h2>Alla risker</h2>
            
            <div class="table-filters">
                <div class="filter-group">
                    <label for="matrixCategoryFilter">Kategori:</label>
                    <select id="matrixCategoryFilter" class="filter-select">
                        <option value="">Alla kategorier</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label for="matrixSearchInput">Sök:</label>
                    <input type="text" id="matrixSearchInput" class="search-input" placeholder="Sök i titel...">
                </div>
            </div>

            <div class="table-wrapper">
                <table class="risks-table">
                    <thead>
                        <tr>
                            <th>Titel</th>
                            <th>Kategori</th>
                            <th>Sannolikhet</th>
                            <th>Konsekvens</th>
                            <th>Riskvärde</th>
                            <th>Risknivå</th>
                            <th>Status</th>
                            <th>Åtgärder</th>
                        </tr>
                    </thead>
                    <tbody id="matrixRisksTableBody">
                        <tr>
                            <td colspan="8" style="text-align: center; padding: 20px;">Laddar risker...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </div>

    <script src="{{ url_for('static', filename='js/matrix.js') }}"></script>
</body>
</html>
